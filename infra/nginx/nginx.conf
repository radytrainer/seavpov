# Reverse proxy: TLS termination, security headers, compression, routing.
# Site configuration lives in templates/app.conf.template (the nginx image fills in ${DOMAIN}
# at start-up and writes /etc/nginx/conf.d/app.conf). Certificates are expected at
# /etc/nginx/certs/{fullchain,privkey}.pem (see docs/DEPLOY_AWS.md).

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 2m;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log main;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css text/csv application/json application/javascript
             application/xml image/svg+xml;

  # Basic per-IP protection in front of the application's own rate limits.
  limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;
  limit_req_status 429;

  upstream web { server web:3000; keepalive 16; }
  upstream api { server api:4010; keepalive 16; }


  # Only the generated site config (not the image's default.conf).
  include /etc/nginx/conf.d/app.conf;
}
