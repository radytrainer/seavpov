# Production stack: nginx (TLS) → web (Next.js) + api (Fastify) → PostgreSQL, plus daily backups.
# Usage: cp .env.production.example .env.production && edit, then
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
name: reading-tracker-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    command: ['postgres', '-c', 'max_connections=50', '-c', 'shared_buffers=256MB']
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    logging: *logging

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: reading-tracker-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      API_HOST: 0.0.0.0
      API_PORT: 4010
      APP_ORIGIN: ${APP_ORIGIN:?}
      COOKIE_SECURE: 'true'
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      API_DOCS_ENABLED: 'false'
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-30}
      GLOBAL_RATE_LIMIT_PER_MINUTE: ${GLOBAL_RATE_LIMIT_PER_MINUTE:-600}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # First-administrator bootstrap (used once by `node dist/seed-production.js`).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    networks: [backend]
    logging: *logging

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:4010
        NEXT_PUBLIC_TIME_ZONE: ${TIME_ZONE:-Asia/Phnom_Penh}
    image: reading-tracker-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      API_INTERNAL_URL: http://api:4010
    networks: [backend]
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }
    environment:
      # Public domain, substituted into infra/nginx/templates/app.conf.template.
      DOMAIN: ${DOMAIN:?}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - ./infra/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - ${CERTS_DIR:-./infra/certs}:/etc/nginx/certs:ro
      - ${CERTBOT_WEBROOT:-./infra/certbot-www}:/var/www/certbot:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- --no-check-certificate --header "Host: $DOMAIN" https://127.0.0.1/login >/dev/null || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [backend]
    logging: *logging

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./infra/backup:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
    # Daily backup at ~02:00 UTC (first backup right after start).
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        /scripts/backup.sh || echo "initial backup failed"
        while true; do
          now=$$(date -u +%s); next=$$(date -u -d "$$(date -u +%Y-%m-%d) 02:00" +%s 2>/dev/null || echo $$((now + 86400)))
          [ "$$next" -le "$$now" ] && next=$$((next + 86400))
          sleep $$((next - now))
          /scripts/backup.sh || echo "backup failed"
        done
    networks: [backend]
    logging: *logging

volumes:
  db-data:

networks:
  backend:
